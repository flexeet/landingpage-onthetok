 <!-- ============================================
     SECTION 1: HEADER / NAVIGATION
     OnTheTok Landing Page - Glassmorphism Floating Nav
     ============================================ -->

<style>
/* Glassmorphism Pill Header */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 16px 20px;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.header-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 8px 32px;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid transparent;
    border-radius: 0;
    box-shadow: none;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Scrolled state - show pill */
.header.scrolled {
    top: 16px;
    padding: 0 20px;
}
 
.header.scrolled .header-container {
    padding: 8px 24px;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 100px;
    box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

.header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* Logo */
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
}

.logo img {
    height: 36px;
    width: auto;
}

.logo-text {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: #ffffff;
    letter-spacing: -0.02em;
    text-shadow:
        -2px -1px 0px #25F4EE,
        2px 2px 0px #FE2C55;
    transition: all var(--transition-base);
}

.logo:hover .logo-text {
    animation: glitch 0.3s;
}

@keyframes glitch {
    0% { text-shadow: -2px -1px 0px #25F4EE, 2px 2px 0px #FE2C55; }
    25% { text-shadow: 2px 1px 0px #25F4EE, -1px -2px 0px #FE2C55; }
    50% { text-shadow: -1px 2px 0px #25F4EE, 2px -1px 0px #FE2C55; }
    75% { text-shadow: 2px -1px 0px #25F4EE, -2px 2px 0px #FE2C55; }
    100% { text-shadow: -2px -1px 0px #25F4EE, 2px 2px 0px #FE2C55; }
}

/* Desktop Navigation */
.nav {
    display: flex;
    align-items: center;
    gap: 4px;
}

.nav-link {
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    border-radius: var(--radius-md);
    transition: all var(--transition-fast);
    text-decoration: none;
}

.nav-link:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.1);
}

.nav-cta {
    margin-left: 16px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    color: #000;
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    border-radius: 100px;
    transition: all var(--transition-base);
    text-decoration: none;
}

.nav-cta:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 30px rgba(16, 185, 129, 0.3);
}

/* Mobile Menu Button */
.mobile-menu-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s ease;
}

.mobile-menu-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.25);
}

.mobile-menu-btn svg {
    width: 20px;
    height: 20px;
    color: #ffffff;
}

/* Mobile Navigation */
.mobile-nav {
    display: none;
    position: absolute;
    top: calc(100% + 12px);
    left: 20px;
    right: 20px;
    background: rgba(20, 20, 25, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 8px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.mobile-nav.active {
    display: block;
}

.mobile-nav-link {
    display: block;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    border-radius: 16px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.mobile-nav-link:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.08);
}

.mobile-nav-divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
    margin: 8px 12px;
}

.mobile-nav-cta {
    display: block;
    margin: 8px;
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    color: #000;
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    border-radius: 16px;
    text-decoration: none;
    transition: all 0.3s ease;
}

.mobile-nav-cta:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 30px rgba(16, 185, 129, 0.3);
}

@media (max-width: 968px) {
    .header-container {
        padding: 12px 20px;
    }

    .nav {
        display: none;
    }

    .mobile-menu-btn {
        display: flex;
    }
}
</style>

<header class="header" id="header">
    <div class="header-container">
        <div class="header-inner">
            <!-- Logo -->
            <a href="#" class="logo">
                <img src="https://flxr2.com/ott/logo.png" alt="OnTheTok">
                <span class="logo-text">OnTheTok</span>
            </a>

            <!-- Desktop Navigation -->
            <nav class="nav">
                <a href="#masalah" class="nav-link">Masalah</a>
                <a href="#solusi" class="nav-link">Solusi</a>
                <a href="#cara-kerja" class="nav-link">Cara Kerja</a>
                <a href="#fitur" class="nav-link">Fitur</a>
                <a href="#harga" class="nav-link">Harga</a>
                <a href="#faq" class="nav-link">FAQ</a>
                <a href="https://wa.me/6287777220117?text=Halo,%20saya%20ingin%20konsultasi%20tentang%20OnTheTok" class="nav-cta">
                    Konsultasi Gratis
                </a>
            </nav>

            <!-- Mobile Menu Button -->
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav" id="mobileNav">
        <a href="#masalah" class="mobile-nav-link">Masalah</a>
        <a href="#solusi" class="mobile-nav-link">Solusi</a>
        <a href="#cara-kerja" class="mobile-nav-link">Cara Kerja</a>
        <a href="#fitur" class="mobile-nav-link">Fitur</a>
        <a href="#harga" class="mobile-nav-link">Harga</a>
        <a href="#faq" class="mobile-nav-link">FAQ</a>
        <div class="mobile-nav-divider"></div>
        <a href="https://wa.me/6287777220117?text=Halo,%20saya%20ingin%20konsultasi%20tentang%20OnTheTok" class="mobile-nav-cta">
            Konsultasi Gratis
        </a>
    </nav>
</header>

<script>
// Header scroll effect
const header = document.getElementById('header');
window.addEventListener('scroll', () => {
    if (window.scrollY > 50) {
        header.classList.add('scrolled');
    } else {
        header.classList.remove('scrolled');
    }
});

// Mobile menu toggle
const mobileMenuBtn = document.getElementById('mobileMenuBtn');
const mobileNav = document.getElementById('mobileNav');

mobileMenuBtn.addEventListener('click', () => {
    mobileNav.classList.toggle('active');
});

// Close mobile menu when clicking a link
document.querySelectorAll('.mobile-nav-link, .mobile-nav-cta').forEach(link => {
    link.addEventListener('click', () => {
        mobileNav.classList.remove('active');
    });
});

// Smooth scroll for anchor links
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    });
});
</script>
