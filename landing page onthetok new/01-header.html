<!-- ============================================
     SECTION 1: HEADER / NAVIGATION
     OnTheTok Landing Page
     ============================================ -->

<style>
/* Header Styles */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 16px 0;
    transition: all var(--transition-base);
}

.header.scrolled {
    background: rgba(10, 10, 10, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-color);
    padding: 12px 0;
}

.header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    height: 38px;
    width: auto;
}

.logo-text {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: #ffffff;
    letter-spacing: -0.02em;
    text-shadow: 
        -2px -1px 0px #25F4EE,
        2px 2px 0px #FE2C55;
    transition: all var(--transition-base);
}

.logo:hover .logo-text {
    animation: glitch 0.3s;
}

@keyframes glitch {
    0% { text-shadow: -2px -1px 0px #25F4EE, 2px 2px 0px #FE2C55; }
    25% { text-shadow: 2px 1px 0px #25F4EE, -1px -2px 0px #FE2C55; }
    50% { text-shadow: -1px 2px 0px #25F4EE, 2px -1px 0px #FE2C55; }
    75% { text-shadow: 2px -1px 0px #25F4EE, -2px 2px 0px #FE2C55; }
    100% { text-shadow: -2px -1px 0px #25F4EE, 2px 2px 0px #FE2C55; }
}

.nav {
    display: flex;
    align-items: center;
    gap: 4px;
}

.nav-link {
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-gray-400);
    border-radius: var(--radius-md);
    transition: all var(--transition-fast);
}

.nav-link:hover {
    color: var(--text-white);
    background: rgba(255, 255, 255, 0.05);
}

.nav-cta {
    margin-left: 16px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    color: #000;
    background: var(--accent-primary);
    border-radius: var(--radius-md);
    transition: all var(--transition-base);
}

.nav-cta:hover {
    background: #059669;
    transform: translateY(-1px);
}

/* Mobile Menu */
.mobile-menu-btn {
    display: none;
    padding: 8px;
    background: none;
    border: none;
    color: var(--text-white);
    cursor: pointer;
}

.mobile-nav {
    display: none;
    position: absolute;
    top: 100%;
    left: 16px;
    right: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-top: 8px;
}

.mobile-nav.active {
    display: block;
}

.mobile-nav-link {
    display: block;
    padding: 12px 16px;
    font-size: 15px;
    color: var(--text-gray-400);
    border-radius: var(--radius-md);
    transition: all var(--transition-fast);
}

.mobile-nav-link:hover {
    color: var(--text-white);
    background: rgba(255, 255, 255, 0.05);
}

@media (max-width: 968px) {
    .nav {
        display: none;
    }
    
    .mobile-menu-btn {
        display: flex;
    }
}
</style>

<header class="header" id="header">
    <div class="container">
        <div class="header-inner">
            <!-- Logo -->
            <a href="#" class="logo">
                <img src="https://flxr2.com/ott/logo.png" alt="OnTheTok">
                <span class="logo-text">onthetok</span>
            </a>

            <!-- Desktop Navigation -->
            <nav class="nav" id="nav">
                <a href="#masalah" class="nav-link">Masalah</a>
                <a href="#solusi" class="nav-link">Solusi</a>
                <a href="#cara-kerja" class="nav-link">Cara Kerja</a>
                <a href="#fitur" class="nav-link">Fitur</a>
                <a href="#harga" class="nav-link">Harga</a>
                <a href="#faq" class="nav-link">FAQ</a>
                <a href="https://wa.me/6287777220117?text=Halo,%20saya%20ingin%20konsultasi%20tentang%20OnTheTok" class="nav-cta">
                    Konsultasi Gratis
                </a>
            </nav>

            <!-- Mobile Menu Button -->
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>

        <!-- Mobile Navigation -->
        <nav class="mobile-nav" id="mobileNav">
            <a href="#masalah" class="mobile-nav-link">Masalah</a>
            <a href="#solusi" class="mobile-nav-link">Solusi</a>
            <a href="#cara-kerja" class="mobile-nav-link">Cara Kerja</a>
            <a href="#fitur" class="mobile-nav-link">Fitur</a>
            <a href="#harga" class="mobile-nav-link">Harga</a>
            <a href="#faq" class="mobile-nav-link">FAQ</a>
            <a href="https://wa.me/6287777220117" class="mobile-nav-link" style="color: var(--accent-primary); font-weight: 600;">Konsultasi Gratis</a>
        </nav>
    </div>
</header>

<script>
// Header scroll effect
const header = document.getElementById('header');
window.addEventListener('scroll', () => {
    if (window.scrollY > 50) {
        header.classList.add('scrolled');
    } else {
        header.classList.remove('scrolled');
    }
});

// Mobile menu toggle
const mobileMenuBtn = document.getElementById('mobileMenuBtn');
const mobileNav = document.getElementById('mobileNav');

mobileMenuBtn.addEventListener('click', () => {
    mobileNav.classList.toggle('active');
});

// Close mobile menu when clicking a link
document.querySelectorAll('.mobile-nav-link').forEach(link => {
    link.addEventListener('click', () => {
        mobileNav.classList.remove('active');
    });
});

// Smooth scroll for anchor links
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    });
});
</script>
